version: 2.1

orbs:
  prodsec: snyk/prodsec-orb@1

defaults: &defaults
  resource_class: small
  docker:
  - image: cimg/node:20.20.2
  working_directory: ~/policy

go_defaults: &go_defaults
  resource_class: small
  docker:
  - image: cimg/go:1.26
  working_directory: ~/policy

commands:
  npmrc:
    steps:
      - run:
          name: Create .npmrc
          command: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc

  install:
    steps:
      - run:
          name: Install dependencies
          command: npm install
      - persist_to_workspace:
          root: .
          paths:
            - node_modules/

jobs:
  install:
    <<: *defaults
    steps:
      - checkout
      - npmrc
      - install
  lint:
    <<: *defaults
    steps:
      - checkout
      - attach_workspace:
          at: ~/policy
      - run:
          name: Run linting
          command: npm run lint
  security_scans:
    <<: *defaults
    steps:
      - checkout
      - attach_workspace:
          at: ~/policy
      - prodsec/security_scans:
          mode: auto
          release-branch: master
          open-source-scan: low # severity threshold used for SCA
          code-scan: high # severity threshold used for SAST
          open-source-additional-arguments: --exclude=test
          org: appsecex_ignores
  test:
    <<: *defaults
    steps:
      - checkout
      - attach_workspace:
          at: ~/policy
      - run:
          name: Run tests
          command: npm run test
      - store_test_results:
          path: reports/jest/
      - store_artifacts:
          path: reports/jest/
  go_lint:
    <<: *go_defaults
    docker:
    - image: golangci/golangci-lint:v2.9.0-alpine
    steps:
      - checkout
      - run:
          name: Run Go linting
          command: cd go && golangci-lint run
  go_test:
    <<: *go_defaults
    steps:
      - checkout
      - run:
          name: Run Go tests
          command: cd go && go test ./... -count=1
  release:
    <<: *defaults
    steps:
      - checkout
      - npmrc
      - install
      - run:
          name: Release on GitHub and npm (OIDC Trusted Publishing)
          command: |
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            npx semantic-release@^24
      - run:
          name: Release the Go module on GitHub
          working_directory: go
          command: |
            git fetch --quiet --tags origin
            last_release=$(git describe --tags --abbrev=0 --match 'go/v*' HEAD 2>/dev/null || true)
            if [ -z "$last_release" ]; then
              echo "No go/v* tag yet, releasing the initial version of the Go module"
            elif ! git diff --name-only "$last_release" HEAD | grep -q '^go/'; then
              echo "No changes under go/ since $last_release, skipping the Go module release"
              exit 0
            fi
            npm install
            npx semantic-release

workflows:
  version: 2
  test_and_release:
    jobs:
      - prodsec/secrets-scan:
          name: Scan repository for secrets
          context:
            - snyk-bot-slack
            - prodsec-orb-runtime
          channel: narwhal-alerts
      - install:
          name: Install
      - lint:
          name: Lint
          requires:
            - Install
          filters:
            branches:
              ignore:
                - master
      - security_scans:
          name: Security Scans
          context:
            - narwhal-policy
            - appsecex_ignores
            - prodsec-orb-runtime
          requires:
            - Install
      - test:
          name: Test
          requires:
            - Lint
          filters:
            branches:
              ignore:
                - master
      - go_lint:
          name: Go Lint
          filters:
            branches:
              ignore:
                - master
      - go_test:
          name: Go Test
          filters:
            branches:
              ignore:
                - master
      - release:
          name: Release
          context:
            - nodejs-install
            - github-release
          filters:
            branches:
              only:
                - master

  Daily_Scan:
    jobs:
      - install:
          name: Install
      - security_scans:
          name: Security Scans
          context:
            - narwhal-policy
            - appsecex_ignores
            - prodsec-orb-runtime
          requires:
            - Install
    triggers:
      - schedule:
          cron: "0 0 * * *"
          filters:
            branches:
              only:
                - master
